<style>
:root{color-scheme:light;--bg:#f4f5fc;--card:#fff;--line:#e3e4ef;--tx:#14151f;--tx2:#4d4f60;--mut:#7e8095;--a:#6d28d9;--b:#eb6834;--crit:#e34948}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 30px;max-width:380px;width:calc(100% - 40px);
box-shadow:0 10px 30px rgba(20,21,31,.08)}
h1{font-size:19px;margin:0 0 6px;background:linear-gradient(115deg,var(--a),#9333ea 45%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--tx2);font-size:14px;margin:0 0 18px}
input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin-bottom:10px}
button{width:100%;padding:11px 12px;border:0;border-radius:9px;background:var(--a);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:active{opacity:.85}
.err{color:var(--crit);font-size:13px;min-height:18px;margin-top:8px}
</style></head>

const ITERATIONS = 250000;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryUnlock(password) {
  const enc = new TextEncoder();
  const passKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const aesKey = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
    passKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBytes(IV) },
    aesKey,
    b64ToBytes(CIPHERTEXT)
  );
  return new TextDecoder().decode(plainBuf);
}

document.getElementById('gateform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try {
    const html = await tryUnlock(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    errEl.textContent = 'Falsches Passwort.';
  }
});
